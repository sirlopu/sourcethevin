# Netlify config for the apps/web Vite SPA.
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Build-time config (e.g. VITE_API_BASE_URL) is read from environment
# variables set in the Netlify UI / CLI — no secrets are committed here.
[build]
  command = "npm ci && npm run build --workspace apps/web"
  publish = "apps/web/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
